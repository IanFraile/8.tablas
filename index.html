<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css en tablas</title>
    <style>
        table,td,th {
            border: 2px solid blue;
            border-collapse: collapse;
        }
        
        table {width: 60%; margin: auto;}
        
        tr {height: 80px;}
        
        td {vertical-align: center;
            text-align: center;}
        
        tr:nth-child(even) {
            background-color: aquamarine;
        }
        
        tr:nth-child(odd) {
            background-color: antiquewhite;
        }
        
        tr:hover {background-color: grey;}

        thead {
            background-color: blue;
            color: green;}

        tbody {color: blue;}

        tfoot {color: red;}
        
    </style>
</head>
<body>
    <h1>Css en tablas</h1>
    <div id="contenedor tabla">
    <table>
        <colgroup>
            <col style="width: 300px;">
            <col style="width: 100px;">
        </colgroup>
        <thead>
        <tr id="primera-fila">
            <th>
                Artículo
            </th>
            <th>
                Precio
            </th>
        </tr>
        <tr>
            <td>Filipinos</td>
            <td>1.90€</td>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Aceite de oliva</td>
            <td>10.00€</td>
        </tr>
        <tr>
            <td>Cocacola</td>
            <td>1.20€</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td>Tortas de Alcazar</td>
            <td>6.50€</td>
        </tr>
        <tr>
            <td>Miguelitos de La Roda</td>
            <td>12.00€</td>
        </tr>
        </tfoot>
    </table>
    </div>
    <a href="padding y márgenes.html">Padding y Márgenes</a>
</body>
</html>
